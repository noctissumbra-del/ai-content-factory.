name: Generate Voice
on:
  workflow_dispatch:

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generate voice
        run: python src/generate_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: output/
